<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>polygam.agency</title>
<meta name="description" content="polygam.agency — is coming.">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow"><!-- DEV: vor dem Go-live entfernen -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;700;900&family=Lora:wght@400;500;600;700&family=Playfair+Display:wght@400;700;900&family=Space+Grotesk:wght@300;400;700&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --fg: #000; --muted: rgba(0,0,0,.55); --bg: #fff; }
  html, body { margin: 0; height: 100%; color: var(--fg); overflow: hidden; background: var(--bg); }
  main {
    position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
    padding: 0 16px; text-align: center;
  }
  .soon { position: fixed; left: 0; right: 0; bottom: clamp(24px, 6vh, 56px); text-align: center; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .ig { display: block; width: 22px; height: 22px; color: #000; pointer-events: auto;
    opacity: 0; animation: in 1.6s 1.6s ease forwards; transition: opacity .2s ease; }
  .ig:hover, .ig:focus-visible { opacity: .55 !important; }
  .ig svg { display: block; width: 100%; height: 100%; }
  h1 {
    margin: 0; line-height: 0;
    opacity: 0; animation: in 1.8s .9s cubic-bezier(.2,.7,.2,1) forwards;
  }
  /* Handschrift-Schriftzug (assets/polygam-schriftzug.png) als Maske -> Farbe per CSS */
  .logo {
    display: block; width: 100%; aspect-ratio: 848 / 292;
    background: #000;
    -webkit-mask: url(assets/polygam-schriftzug.png) center / contain no-repeat;
            mask: url(assets/polygam-schriftzug.png) center / contain no-repeat;
  }
  /* Hinweis: Schriftzug ist (noch) nicht das finale Logo. Mittig unter dem Logo;
     Größe in cqw, damit er mit dem Logo skaliert (mit Untergrenze für kleine Displays). */
  .mark { position: relative; container-type: inline-size; width: clamp(240px, 52vw, 720px); }

  /* ---- Buchstaben-Hover: zufällige Schrift ----
     Der Schriftzug ist in 7 Ebenen zerlegt (assets/letters/<x>.png, je in voller Logo-Größe,
     nur ein Buchstabe sichtbar). .logo bleibt als unsichtbarer Platzhalter für die Größe.
     .hit = Hover-Fläche (Rechteck um den Buchstaben, % der Logo-Breite/-Höhe 848×292).
     Beim Hover wird die Handschrift-Ebene ausgeblendet und stattdessen ein echtes
     Textzeichen (.glyph) horizontal in der Hover-Fläche zentriert, alle auf einer gemeinsamen Grundlinie. */
  h1 { position: relative; }
  .logo { background: none; -webkit-mask: none; mask: none; }
  .letter { position: absolute; inset: 0; background: #000;
    -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
  .letter.is-morphing { opacity: 0; }
  .hit { position: absolute; pointer-events: auto; }
  .glyph { position: absolute; text-align: center; pointer-events: none; opacity: 0; color: #000;
    line-height: 1; white-space: nowrap; font-size: 15cqw; }
  .glyph.is-on { opacity: 1; }
  .hit[data-letter="p"] { left: 0.71%; top: 21.58%; width: 27%; height: 60.96%; }
  .glyph[data-for="p"] { left: 0.71%; width: 27%; }
  .hit[data-letter="o"] { left: 30.19%; top: 27.74%; width: 11.44%; height: 28.42%; }
  .glyph[data-for="o"] { left: 30.19%; width: 11.44%; }
  .hit[data-letter="l"] { left: 43.51%; top: 2.05%; width: 10.73%; height: 54.45%; }
  .glyph[data-for="l"] { left: 43.51%; width: 10.73%; }
  .hit[data-letter="y"] { left: 50.24%; top: 19.52%; width: 13.8%; height: 78.42%; }
  .glyph[data-for="y"] { left: 50.24%; width: 13.8%; }
  .hit[data-letter="g"] { left: 61.91%; top: 25%; width: 13.09%; height: 63.36%; }
  .glyph[data-for="g"] { left: 61.91%; width: 13.09%; }
  .hit[data-letter="a"] { left: 75.59%; top: 27.74%; width: 9.55%; height: 29.79%; }
  .glyph[data-for="a"] { left: 75.59%; width: 9.55%; }
  .hit[data-letter="m"] { left: 87.03%; top: 27.05%; width: 12.26%; height: 35.27%; }
  .glyph[data-for="m"] { left: 87.03%; width: 12.26%; }
  @media (max-width: 600px) { .mark { width: 80vw; } }
  .note {
    position: absolute; left: 50%; top: 100%; margin-top: 1.2cqw; transform: translateX(-50%);
    white-space: nowrap; font: 400 clamp(14px, 3.5cqw, 26px)/1 'Times New Roman', Times, serif;
    text-transform: uppercase; color: #000;
    opacity: 0; animation: note-in 1.6s 1.3s ease forwards;
  }
  @keyframes note-in { from { opacity: 0; filter: blur(6px); } to { opacity: 1; filter: none; } }
  p {
    margin: 0; font: 400 clamp(.6rem, 1.2vw, .72rem)/1 'Times New Roman', Times, serif;
    letter-spacing: .45em; text-transform: uppercase; color: var(--muted); padding-left: .45em;
    opacity: 0; animation: in 1.6s 1.6s ease forwards;
  }
  @keyframes in { from { opacity: 0; transform: translateY(8px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
  @media (prefers-reduced-motion: reduce) { h1, p, .note, .ig { animation-duration: .01s; animation-delay: 0s; } }
</style>
</head>
<body>
<main>
  <div class="mark">
    <h1>
      <span class="logo" role="img" aria-label="polygam"></span>
      <span class="letter" data-letter="p" style="--m:url(assets/letters/p.png)" aria-hidden="true"></span>
      <span class="letter" data-letter="o" style="--m:url(assets/letters/o.png)" aria-hidden="true"></span>
      <span class="letter" data-letter="l" style="--m:url(assets/letters/l.png)" aria-hidden="true"></span>
      <span class="letter" data-letter="y" style="--m:url(assets/letters/y.png)" aria-hidden="true"></span>
      <span class="letter" data-letter="g" style="--m:url(assets/letters/g.png)" aria-hidden="true"></span>
      <span class="letter" data-letter="a" style="--m:url(assets/letters/a.png)" aria-hidden="true"></span>
      <span class="letter" data-letter="m" style="--m:url(assets/letters/m.png)" aria-hidden="true"></span>
    </h1>
    <!-- Zeichen für den Schriftwechsel (Schrift wird per JS gesetzt) -->
    <span class="glyph" data-for="p" aria-hidden="true">p</span>
    <span class="glyph" data-for="o" aria-hidden="true">o</span>
    <span class="glyph" data-for="l" aria-hidden="true">l</span>
    <span class="glyph" data-for="y" aria-hidden="true">y</span>
    <span class="glyph" data-for="g" aria-hidden="true">g</span>
    <span class="glyph" data-for="a" aria-hidden="true">a</span>
    <span class="glyph" data-for="m" aria-hidden="true">m</span>
    <!-- Hover-Flächen; y zuerst, damit l und g in den Überlappungen oben liegen -->
    <span class="hit" data-letter="p"></span>
    <span class="hit" data-letter="o"></span>
    <span class="hit" data-letter="y"></span>
    <span class="hit" data-letter="l"></span>
    <span class="hit" data-letter="g"></span>
    <span class="hit" data-letter="a"></span>
    <span class="hit" data-letter="m"></span>
    <div class="note">(Not the logo)</div>
  </div>
</main>
<div class="soon">
  <a class="ig" href="https://www.instagram.com/polygam.agency/" target="_blank" rel="noopener" aria-label="polygam.agency auf Instagram">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor"/>
    </svg>
  </a>
  <p>is coming</p>
</div>

<script>
/* ============================================================
   Buchstaben-Hover: Solange die Maus auf einem Buchstaben von "polygam" liegt
   (bzw. nach dem Antippen), tauscht er im Takt Schrift, Gewicht, Groß-/Klein-
   schreibung und Größe aus; beim Verlassen springt er zurück zur Handschrift.
   Schriften: Inter, Lora, Playfair Display, Space Grotesk, IBM Plex Mono, Helvetica, Times New Roman. Die Zeichen bleiben in
   ihrem Slot und stehen auf einer gemeinsamen Grundlinie.
============================================================ */
const FAMILIES = [
  { css: "'Inter', sans-serif",                            weights: [100, 400, 700, 900], web: true },
  { css: "'Lora', serif",                                  weights: [400, 500, 600, 700], web: true },
  { css: "'Playfair Display', serif",                      weights: [400, 700, 900],      web: true },
  { css: "'Space Grotesk', sans-serif",                    weights: [300, 400, 700],      web: true },
  { css: "'IBM Plex Mono', monospace",                     weights: [400, 700],           web: true },
  { css: "Helvetica, 'Helvetica Neue', Arial, sans-serif", weights: [400, 700] },
  { css: "'Times New Roman', Times, serif",                weights: [400, 700] },
]
const TICK_MS = [180, 300]   // Wechseltakt (zufällig in diesem Bereich): schnell genug für Bewegung, langsam genug, dass jeder Zustand lesbar bleibt
const TOUCH_MS = 3000        // Touch: Wechsel läuft nach dem Antippen so lange
const CAPS_RATIO = 0.45
const SIZE_JITTER = 0.15
const BASELINE = 0.57        // Grundlinie der Handschrift in % der Logo-Höhe (Unterkante von o/a)
const BASE_SIZE = 0.15       // Schriftgröße in Anteilen der Logo-Breite (entspricht 15cqw)

// Web-Fonts vorab laden, damit beim ersten Wechsel nichts nachspringt
FAMILIES.filter(f => f.web).forEach(f => f.weights.forEach(w => document.fonts && document.fonts.load(`${w} 40px ${f.css.split(',')[0]}`, 'polygamPOLYGAM').catch(() => {})))

const mark = document.querySelector('.mark'), logo = document.querySelector('.logo')
const metricsCtx = document.createElement('canvas').getContext('2d')
const pick = arr => arr[Math.floor(Math.random() * arr.length)]

document.querySelectorAll('.hit').forEach(hit => {
  const key = hit.dataset.letter
  const letter = document.querySelector(`.letter[data-letter="${key}"]`)
  const glyph = document.querySelector(`.glyph[data-for="${key}"]`)
  let family = null, weight = 0, timer = 0, stopTimer = 0

  function shuffle() {
    // immer eine andere Familie als zuvor, damit jeder Schritt sichtbar ist
    let f; do { f = pick(FAMILIES) } while (f === family)
    family = f
    weight = pick(f.weights)
    const size = mark.clientWidth * BASE_SIZE * (1 + (Math.random() * 2 - 1) * SIZE_JITTER)
    glyph.textContent = Math.random() < CAPS_RATIO ? key.toUpperCase() : key
    Object.assign(glyph.style, { fontFamily: f.css, fontWeight: weight, fontSize: size + 'px' })
    // Grundlinie: bei line-height 1 liegt sie size/2 + (Ascent - Descent)/2 unter der Oberkante
    metricsCtx.font = `${weight} ${size}px ${f.css}`
    const m = metricsCtx.measureText(glyph.textContent)
    const off = size / 2 + (m.fontBoundingBoxAscent - m.fontBoundingBoxDescent) / 2
    glyph.style.top = logo.clientHeight * BASELINE - off + 'px'
  }
  function tick() {
    shuffle()
    timer = setTimeout(tick, TICK_MS[0] + Math.random() * (TICK_MS[1] - TICK_MS[0]))
  }
  function enter() {
    if (timer) return
    glyph.classList.add('is-on'); letter.classList.add('is-morphing')
    tick()
  }
  function leave() {
    clearTimeout(timer); clearTimeout(stopTimer); timer = stopTimer = 0
    glyph.classList.remove('is-on'); letter.classList.remove('is-morphing')
  }
  hit.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') enter() })
  hit.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') leave() })
  // Touch: Antippen startet den Wechsel für ein paar Sekunden, erneutes Antippen beendet ihn
  hit.addEventListener('pointerup', e => {
    if (e.pointerType === 'mouse') return
    if (timer) leave(); else { enter(); stopTimer = setTimeout(leave, TOUCH_MS) }
  })
})
</script>
</body>
</html>
