<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.143.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.143.0/examples/jsm/"

<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="scene" aria-hidden="true"></canvas>
<main>
  <h1>polygam<span>.agency</span></h1>
</main>
<p class="soon">coming soon</p>

<script type="module">
import * as THREE from 'three'
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js'
import { ConvexHull } from 'three/addons/math/ConvexHull.js'

/* ============================================================
   Basiert auf der GetLayers-Szene "Aether Flux" (Unlicense):
   Silberne Stäbchen entlang eines Curl-Noise-Feldes — hier nicht
   in einem Würfel, sondern in einem facettierten Polyeder.
   Farbwahl per URL: ?look=gold (Standard) | silver | red
============================================================ */
const LOOKS = {
  gold:   { cool: '#7a5a30', warm: '#f7e2b0', spec: '#fff4dc', edge: '#e8c27a', dust: '#a8844c', ambient: 0.14, key: 1.15 },
  silver: { cool: '#9fb0c4', warm: '#f4eee2', spec: '#ffffff', edge: '#dfe6f0', dust: '#7d93b0', ambient: 0.12, key: 1.15 },
  red:    { cool: '#4a0710', warm: '#ff6b74', spec: '#ffd9dc', edge: '#ff8a92', dust: '#9a2a34', ambient: 0.16, key: 1.25 },
}
const look = LOOKS[new URLSearchParams(location.search).get('look')] || LOOKS.gold

const CONFIG = {
  spacing: 0.08,      // Rasterabstand der Stäbchen
  radius: 1.3,        // Umkugelradius des Ikosaeders
  brightness: 0.5,    // Gesamthelligkeit der Szene (Hintergrund, Schrift soll vorne stehen)
  spin: 0.22,         // Taumelgeschwindigkeit
  rodLength: 0.6,
  rodRadius: 0.78,
  flowFreq: 1.05,
  flowSpeed: 0.2,
  camDist: 4.8,
  parallax: 0.5,
  cursorRadius: 0.75,
  cursorPush: 0.4,
  cursorSwirl: 0.8,
  edgeAlpha: 0.22,
  dust: 0.2,
  innerNodes: 6,      // Nodes, die direkt mit dem Hauptkörper verbunden sind
  outerNodes: 16,     // weitere Nodes im Hintergrund
  netSeed: 5,         // andere Zahl = andere Anordnung des Netzwerks
  netBrightness: 0.55,
  lineAlpha: 0.8,
}
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches

const vec3 = hex => { const n = parseInt(hex.slice(1), 16); return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255) }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }

/* ---------- RENDERER ---------- */
const canvas = document.getElementById('scene')
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true })   // transparent über der Netzwerk-Ebene
renderer.setClearColor(0x000000, 0)
const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 80)
camera.position.set(0, 0, 4.3)

/* ============================================================
   IKOSAEDER
   Konvexe Hülle der 12 Ikosaeder-Ecken -> 20 gleichseitige
   Dreiecke. Jede Facette bekommt eine eigene Helligkeit.
============================================================ */
const phi = (1 + Math.sqrt(5)) / 2
const polyPts = [
  [-1, phi, 0], [1, phi, 0], [-1, -phi, 0], [1, -phi, 0],
  [0, -1, phi], [0, 1, phi], [0, -1, -phi], [0, 1, -phi],
  [phi, 0, -1], [phi, 0, 1], [-phi, 0, -1], [-phi, 0, 1],
].map(v => new THREE.Vector3(...v).normalize().multiplyScalar(CONFIG.radius))
const hull = new ConvexHull().setFromPoints(polyPts)
// Abstand zur Oberfläche (negativ = innen) + Index der nächstgelegenen Facette
const hullDist = p => { let m = -Infinity, idx = 0; hull.faces.forEach((f, i) => { const d = f.distanceToPoint(p); if (d > m) { m = d; idx = i } }); return [m, idx] }

const group = new THREE.Group()
scene.add(group)

/* ---------- Stäbchen im Polyeder-Volumen ---------- */
const NOISE_GLSL = `
  vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
  vec4 mod289(vec4 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
  vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
  vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
  float snoise(vec3 v){
    const vec2 C = vec2(1.0/6.0, 1.0/3.0); const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
    vec3 i = floor(v + dot(v, C.yyy)); vec3 x0 = v - i + dot(i, C.xxx);
    vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g;
    vec3 i1 = min(g.xyz, l.zxy); vec3 i2 = max(g.xyz, l.zxy);
    vec3 x1 = x0 - i1 + C.xxx; vec3 x2 = x0 - i2 + C.yyy; vec3 x3 = x0 - D.yyy;
    i = mod289(i);
    vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
    float n_ = 0.142857142857; vec3 ns = n_ * D.wyz - D.xzx;
    vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
    vec4 x_ = floor(j * ns.z); vec4 y_ = floor(j - 7.0 * x_);
    vec4 x = x_ * ns.x + ns.yyyy; vec4 y = y_ * ns.x + ns.yyyy; vec4 h = 1.0 - abs(x) - abs(y);
    vec4 b0 = vec4(x.xy, y.xy); vec4 b1 = vec4(x.zw, y.zw);
    vec4 s0 = floor(b0)*2.0 + 1.0; vec4 s1 = floor(b1)*2.0 + 1.0; vec4 sh = -step(h, vec4(0.0));
    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy; vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
    vec3 p0 = vec3(a0.xy, h.x); vec3 p1 = vec3(a0.zw, h.y); vec3 p2 = vec3(a1.xy, h.z); vec3 p3 = vec3(a1.zw, h.w);
    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
    vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0); m = m * m;
    return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
  }
  vec3 snoiseVec3(vec3 x){ return vec3(snoise(x), snoise(vec3(x.y - 19.1, x.z + 33.4, x.x + 47.2)), snoise(vec3(x.z + 74.2, x.x - 124.5, x.y + 99.4))); }
  vec3 curlNoise(vec3 p){
    const float e = 0.1; vec3 dx = vec3(e,0,0); vec3 dy = vec3(0,e,0); vec3 dz = vec3(0,0,e);
    vec3 px0 = snoiseVec3(p - dx); vec3 px1 = snoiseVec3(p + dx);
    vec3 py0 = snoiseVec3(p - dy); vec3 py1 = snoiseVec3(p + dy);
    vec3 pz0 = snoiseVec3(p - dz); vec3 pz1 = snoiseVec3(p + dz);
    return vec3(py1.z - py0.z - pz1.y + pz0.y, pz1.x - pz0.x - px1.z + px0.z, px1.y - px0.y - py1.x + py0.x) / (2.0 * e);
  }
`

const uniforms = {
  iAlpha: { value: 0 }, uFlowPhase: { value: 0 }, uFreq: { value: CONFIG.flowFreq },
  uRodLen: { value: CONFIG.spacing * CONFIG.rodLength }, uRodRad: { value: CONFIG.spacing * 0.34 * CONFIG.rodRadius },
  uCool: { value: vec3(look.cool) }, uWarm: { value: vec3(look.warm) }, uSpec: { value: vec3(look.spec) },
  uAmbient: { value: look.ambient }, uKey: { value: look.key },
  uBurstT: { value: 0 }, uBurstAmt: { value: 0 },
  uPointer: { value: new THREE.Vector3(99, 99, 99) }, uViewLocal: { value: new THREE.Vector3(0, 0, 1) },
  uPtrStr: { value: 0 }, uPtrRad: { value: CONFIG.cursorRadius }, uPtrPush: { value: CONFIG.cursorPush }, uPtrSwirl: { value: CONFIG.cursorSwirl },
}

{
  const s = CONFIG.spacing, centers = [], rands = [], tones = []
  const tr = rng(11), facetTone = hull.faces.map(() => 0.72 + tr() * 0.5)
  const p = new THREE.Vector3()
  const n = Math.ceil(2.8 / s)
  for (let ix = 0; ix <= n; ix++)
    for (let iy = 0; iy <= n; iy++)
      for (let iz = 0; iz <= n; iz++) {
        const x = -1.4 + ix * s, y = -1.4 + iy * s, z = -1.4 + iz * s
        p.set(x, y, z)
        const [d, face] = hullDist(p)
        if (d > 0) continue
        const edge = -d
        if (Math.random() < Math.min(0.45, edge * 0.5) && edge > 0.1) continue   // Inneres ausdünnen, Rand bleibt dicht
        centers.push(x, y, z); rands.push(Math.random())
        tones.push(edge < 0.22 ? facetTone[face] : 0.85)      // je Facette eigene Helligkeit
      }

  const base = new THREE.CylinderGeometry(0.55, 1.0, 1.0, 6, 1, false)
  const geo = new THREE.InstancedBufferGeometry()
  geo.index = base.index
  geo.setAttribute('position', base.attributes.position)
  geo.setAttribute('normal', base.attributes.normal)
  geo.setAttribute('aCenter', new THREE.InstancedBufferAttribute(new Float32Array(centers), 3))
  geo.setAttribute('aRand', new THREE.InstancedBufferAttribute(new Float32Array(rands), 1))
  geo.setAttribute('aTone', new THREE.InstancedBufferAttribute(new Float32Array(tones), 1))
  geo.instanceCount = rands.length

  const mat = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: NOISE_GLSL + `
      attribute vec3 aCenter; attribute float aRand; attribute float aTone;
      uniform float uFlowPhase; uniform float uFreq; uniform float uRodLen; uniform float uRodRad;
      uniform float uBurstT; uniform float uBurstAmt;
      uniform vec3 uPointer; uniform vec3 uViewLocal;
      uniform float uPtrStr; uniform float uPtrRad; uniform float uPtrPush; uniform float uPtrSwirl;
      varying vec3 vNormal; varying vec3 vView; varying float vAxis; varying float vY; varying float vGlow; varying float vRand; varying float vTone;
      void main(){
        vRand = aRand; vTone = aTone;
        vec3 toP = aCenter - uPointer; float pd = length(toP);
        float infl = exp(-(pd * pd) / (uPtrRad * uPtrRad)) * uPtrStr;
        vec3 outDir = pd > 1e-4 ? toP / pd : vec3(0.0, 1.0, 0.0);
        vec3 ctr = aCenter + outDir * infl * uPtrPush;
        vec3 dir = curlNoise(ctr * uFreq + vec3(0.0, uFlowPhase, uFlowPhase * 0.6));
        float dl = length(dir); dir = dl > 1e-4 ? dir / dl : vec3(0.0, 1.0, 0.0);
        vec3 tang = cross(normalize(uViewLocal), toP); float tl = length(tang);
        if (tl > 1e-4) dir = normalize(mix(dir, tang / tl, clamp(infl * uPtrSwirl, 0.0, 0.92)));
        vec3 up = abs(dir.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
        vec3 tx = normalize(cross(up, dir)); vec3 bz = cross(dir, tx); mat3 basis = mat3(tx, dir, bz);
        float d = length(aCenter);
        float ring = exp(-pow((d - uBurstT * 2.6) / 0.45, 2.0)) * uBurstAmt;
        vGlow = ring + infl * 0.7;
        float len = uRodLen * (0.62 + 0.85 * aRand) * (1.0 + ring * 0.9 + infl * 0.6);
        vec3 p = position; vY = p.y + 0.5; p.y *= len; p.xz *= uRodRad * (0.7 + 0.5 * aRand);
        vec4 mv = modelViewMatrix * vec4(ctr + basis * p, 1.0);
        gl_Position = projectionMatrix * mv;
        vNormal = normalize(normalMatrix * (basis * normal));
        vView = normalize(-mv.xyz);
        vAxis = abs(dot(normalize((modelViewMatrix * vec4(dir, 0.0)).xyz), vView));
      }`,
    fragmentShader: `
      precision highp float;
      uniform vec3 uCool; uniform vec3 uWarm; uniform vec3 uSpec;
      uniform float uAmbient; uniform float uKey; uniform float iAlpha;
      varying vec3 vNormal; varying vec3 vView; varying float vAxis; varying float vY; varying float vGlow; varying float vRand; varying float vTone;
      void main(){
        vec3 N = normalize(vNormal); vec3 V = normalize(vView);
        if (dot(N, V) < 0.0) N = -N;
        vec3 L = normalize(vec3(-0.35, 0.78, 0.52));
        float diff = max(dot(N, L), 0.0);
        float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);
        float spec = pow(max(dot(N, normalize(L + V)), 0.0), 46.0);
        vec3 col = mix(uCool, uWarm, diff * 0.85 + 0.15) * (uAmbient + uKey * diff);
        col += uWarm * fres * 0.5;
        col += uSpec * spec * (0.7 + 0.6 * vAxis);
        col += uSpec * smoothstep(0.86, 1.0, vAxis) * (0.35 + 0.4 * vRand);
        col *= mix(0.55, 1.12, vY) * vTone;      // je Facette eigene Helligkeit -> Low-Poly-Lesbarkeit
        col += uWarm * vGlow * 1.6;
        gl_FragColor = vec4(col * iAlpha, 1.0);
      }`,
  })
  const mesh = new THREE.Mesh(geo, mat)
  mesh.frustumCulled = false
  group.add(mesh)
}

/* ---------- Facettenkanten (feines Drahtgitter) ---------- */
const edgeMat = new THREE.LineBasicMaterial({ color: new THREE.Color(look.edge), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })
group.add(new THREE.LineSegments(
  new THREE.EdgesGeometry(new ConvexGeometry(polyPts.map(p => p.clone().multiplyScalar(1.025))), 1),
  edgeMat
))

/* ============================================================
   NETZWERK
   Kleine Ikosaeder ("Nodes") liegen in einer eigenen, per CSS
   unscharf gezeichneten Hintergrund-Ebene. Linien verbinden Ecken
   der Nodes untereinander und mit Ecken des Hauptkörpers; Licht-
   impulse wandern entlang der Linien.
============================================================ */
const bgRenderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg'), antialias: true })
const bgScene = new THREE.Scene()
bgScene.background = new THREE.Color(0x000000)
bgScene.fog = new THREE.Fog(0x000000, 6, 22)
bgScene.add(new THREE.AmbientLight(0xffffff, 0.25))
const bgKey = new THREE.DirectionalLight(0xffffff, 1.1); bgKey.position.set(-3, 5, 4); bgScene.add(bgKey)

const NR = rng(CONFIG.netSeed)
const icoUnit = polyPts.map(p => p.clone().divideScalar(CONFIG.radius))
const nodes = []
const nodeMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(look.cool).lerp(new THREE.Color(look.warm), 0.35), metalness: 0.7, roughness: 0.35, flatShading: true, transparent: true, opacity: 0 })
const nodeEdgeMat = new THREE.LineBasicMaterial({ color: new THREE.Color(look.edge), transparent: true, opacity: 0 })
const nodeGeo = new THREE.IcosahedronGeometry(1, 0)
const nodeEdges = new THREE.EdgesGeometry(nodeGeo)
// Hochformat: Netzwerk eher in die Höhe als in die Breite verteilen
const portrait = innerHeight > innerWidth
const spread = portrait ? new THREE.Vector3(0.42, 1.9, 1) : new THREE.Vector3(1, 1, 1)
function addNode(pos, r) {
  const g = new THREE.Group()
  g.position.copy(pos).multiply(spread); g.scale.setScalar(r)
  g.quaternion.setFromEuler(new THREE.Euler(NR() * 6, NR() * 6, NR() * 6))
  g.add(new THREE.Mesh(nodeGeo, nodeMat), new THREE.LineSegments(nodeEdges, nodeEdgeMat))
  g.userData.spin = new THREE.Vector3(NR() - 0.5, NR() - 0.5, NR() - 0.5).normalize()
  g.userData.rate = 0.15 + NR() * 0.25
  bgScene.add(g); nodes.push(g)
}
// innerer Ring: direkte Nachbarn des Hauptkörpers
for (let i = 0; i < CONFIG.innerNodes; i++) {
  const a = (i / CONFIG.innerNodes) * Math.PI * 2 + NR() * 0.5
  const d = 3.2 + NR() * 1.6
  addNode(new THREE.Vector3(Math.cos(a) * d * 1.35, Math.sin(a) * d * 0.75, -1.5 - NR() * 3), 0.28 + NR() * 0.18)
}
// äußeres Feld: weiter hinten, füllt den Bildschirm
for (let i = 0; i < CONFIG.outerNodes; i++) {
  let p
  do p = new THREE.Vector3((NR() * 2 - 1) * 12, (NR() * 2 - 1) * 6.5, -5 - NR() * 9)
  while (Math.abs(p.x) < 3 && Math.abs(p.y) < 2.2)
  addNode(p, 0.3 + NR() * 0.3)
}

// Ecke von a, die am ehesten Richtung b zeigt (fix, dreht sich mit dem Node)
const cornerToward = (aPos, aQuat, bPos) => {
  const d = bPos.clone().sub(aPos).applyQuaternion(aQuat.clone().invert()).normalize()
  let best = 0, bd = -2
  icoUnit.forEach((v, i) => { const s = v.dot(d); if (s > bd) { bd = s; best = i } })
  return best
}
// Verbindungen: jeder Node zu seinen 2 nächsten Nachbarn, innerer Ring zusätzlich zum Hauptkörper
const links = []   // { a: node|null(=Hauptkörper), ca, b: node, cb }
const linkKey = new Set()
nodes.forEach((nA, i) => {
  nodes.map((nB, j) => [j, nA.position.distanceTo(nB.position)]).filter(([j]) => j !== i)
    .sort((x, y) => x[1] - y[1]).slice(0, 2).forEach(([j]) => {
      const k = Math.min(i, j) + '-' + Math.max(i, j)
      if (linkKey.has(k)) return; linkKey.add(k)
      const nB = nodes[j]
      links.push({ a: nA, ca: cornerToward(nA.position, nA.quaternion, nB.position), b: nB, cb: cornerToward(nB.position, nB.quaternion, nA.position) })
    })
})
const mainLinks = []
for (let i = 0; i < CONFIG.innerNodes; i++) {
  const nB = nodes[i]
  mainLinks.push({ ca: cornerToward(group.position, group.quaternion, nB.position), b: nB, cb: cornerToward(nB.position, nB.quaternion, group.position) })
}
// zwei Ecken des Hauptkörpers schicken zusätzlich eine Linie ins äußere Feld
for (let k = 0; k < 2; k++) {
  const nB = nodes[CONFIG.innerNodes + Math.floor(NR() * CONFIG.outerNodes)]
  mainLinks.push({ ca: Math.floor(NR() * 12), b: nB, cb: cornerToward(nB.position, nB.quaternion, group.position) })
}

// Linien-Material: Grundglimmen, das vom Hauptkörper weg verblasst, plus wandernder Impuls
function lineMaterial(fadeFar) {
  return new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uColor: { value: vec3(look.edge) }, uAlpha: { value: 0 }, uFade: { value: fadeFar } },
    vertexShader: `attribute float aT; attribute float aSeed; varying float vT; varying float vSeed;
      void main(){ vT = aT; vSeed = aSeed; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `precision highp float; uniform float uTime; uniform vec3 uColor; uniform float uAlpha; uniform float uFade;
      varying float vT; varying float vSeed;
      void main(){
        float base = mix(1.0, uFade, vT) * 0.32;
        float ph = fract(uTime * (0.12 + vSeed * 0.1) + vSeed * 7.0);
        float pulse = exp(-pow((vT - ph) * 14.0, 2.0)) * 1.4;
        vec3 c = uColor * (base + pulse) * uAlpha;
        gl_FragColor = vec4(c, max(c.r, max(c.g, c.b)));
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, premultipliedAlpha: true,
  })
}
function lineSet(count, mat, target) {
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 6), 3).setUsage(THREE.DynamicDrawUsage))
  const tArr = new Float32Array(count * 2), sArr = new Float32Array(count * 2)
  for (let i = 0; i < count; i++) { tArr[i * 2 + 1] = 1; sArr[i * 2] = sArr[i * 2 + 1] = NR() }
  g.setAttribute('aT', new THREE.BufferAttribute(tArr, 1))
  g.setAttribute('aSeed', new THREE.BufferAttribute(sArr, 1))
  const ls = new THREE.LineSegments(g, mat); ls.frustumCulled = false
  target.add(ls); return g
}
const mainLineMat = lineMaterial(0.15), netLineMat = lineMaterial(0.6)
const mainLineGeo = lineSet(mainLinks.length, mainLineMat, scene)       // scharf, vorne
const netLineGeo = lineSet(links.length, netLineMat, bgScene)           // unscharf, hinten

const _v = new THREE.Vector3()
const cornerWorld = (obj, idx, scale, out) => out.copy(icoUnit[idx]).multiplyScalar(scale).applyQuaternion(obj.quaternion).add(obj.position)
function updateNetwork(dt, now) {
  for (const nd of nodes) nd.quaternion.premultiply(dq.setFromAxisAngle(nd.userData.spin, dt * nd.userData.rate))
  let arr = netLineGeo.attributes.position.array
  links.forEach((l, i) => {
    cornerWorld(l.a, l.ca, l.a.scale.x, _v).toArray(arr, i * 6)
    cornerWorld(l.b, l.cb, l.b.scale.x, _v).toArray(arr, i * 6 + 3)
  })
  netLineGeo.attributes.position.needsUpdate = true
  arr = mainLineGeo.attributes.position.array
  mainLinks.forEach((l, i) => {
    cornerWorld(group, l.ca, CONFIG.radius * 1.025, _v).toArray(arr, i * 6)
    cornerWorld(l.b, l.cb, l.b.scale.x, _v).toArray(arr, i * 6 + 3)
  })
  mainLineGeo.attributes.position.needsUpdate = true
  mainLineMat.uniforms.uTime.value = netLineMat.uniforms.uTime.value = now
}

/* ---------- Staub ---------- */
const DN = 380, dpos = new Float32Array(DN * 3), dsize = new Float32Array(DN)
for (let i = 0; i < DN; i++) {
  const r = 3 + Math.random() * 9, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1)
  dpos.set([r * Math.sin(ph) * Math.cos(th), r * Math.sin(ph) * Math.sin(th), r * Math.cos(ph)], i * 3)
  dsize[i] = 1 + Math.random() * 2
}
const dgeo = new THREE.BufferGeometry()
dgeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3))
dgeo.setAttribute('aSize', new THREE.BufferAttribute(dsize, 1))
const dustU = { iTime: { value: 0 }, iAlpha: uniforms.iAlpha, uColor: { value: vec3(look.dust) }, uBright: { value: CONFIG.dust }, uDpr: { value: 1 } }
const dust = new THREE.Points(dgeo, new THREE.ShaderMaterial({
  uniforms: dustU,
  vertexShader: `attribute float aSize; uniform float iTime; uniform float uDpr; varying float vTw;
    void main(){ vTw = 0.45 + 0.55 * sin(iTime * 0.25 + position.x * 0.7 + position.y * 1.3);
      vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mv;
      gl_PointSize = aSize * uDpr * 110.0 / max(0.1, -mv.z); }`,
  fragmentShader: `precision highp float; uniform vec3 uColor; uniform float uBright; uniform float iAlpha; varying float vTw;
    void main(){ vec2 d = gl_PointCoord - 0.5; float a = exp(-dot(d, d) * 9.0);
      gl_FragColor = vec4(uColor * a * vTw * uBright * 1.4, 1.0) * a * iAlpha; }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
}))
dust.frustumCulled = false
scene.add(dust)

/* ---------- Interaktion ---------- */
const pointer = new THREE.Vector2()
let ptrActive = false
addEventListener('pointermove', e => {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -((e.clientY / innerHeight) * 2 - 1))
  ptrActive = e.pointerType === 'mouse'
}, { passive: true })
document.addEventListener('pointerleave', () => { ptrActive = false })
addEventListener('pointerdown', () => { uniforms.uBurstT.value = 0; uniforms.uBurstAmt.value = 1 })

let camDist = CONFIG.camDist
function resize() {
  const w = innerWidth, h = innerHeight, dpr = Math.min(devicePixelRatio, 2)
  if (!w || !h) return                                              // unsichtbar geladen (z. B. Hintergrund-Tab)
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false)
  bgRenderer.setPixelRatio(1); bgRenderer.setSize(w, h, false)   // wird ohnehin weichgezeichnet
  camera.aspect = w / h; camera.updateProjectionMatrix()
  camDist = Math.max(CONFIG.camDist, 4.6 / camera.aspect / 0.828)   // Hochformat: Polyeder bleibt vollständig sichtbar
  dustU.uDpr.value = dpr
}
addEventListener('resize', resize); resize()

/* ---------- Loop ---------- */
const ray = new THREE.Vector3(), dir = new THREE.Vector3(), n = new THREE.Vector3(), hit = new THREE.Vector3(), invq = new THREE.Quaternion()
const axis = new THREE.Vector3(), dq = new THREE.Quaternion()
group.quaternion.setFromEuler(new THREE.Euler(0.5, 0.3, 0.2))
const start = performance.now()
let last = start / 1000, t = 0
const speed = reduced ? 0.25 : 1
function frame() {
  requestAnimationFrame(frame)
  const now = performance.now() / 1000, dt = Math.min(0.05, now - last); last = now
  t += dt * speed
  dustU.iTime.value = now
  uniforms.uFlowPhase.value += dt * CONFIG.flowSpeed * speed

  // Taumeln in alle Richtungen: Drehachse wandert langsam, der Körper rollt frei
  axis.set(Math.sin(t * 0.13), Math.cos(t * 0.09) + 0.4, Math.sin(t * 0.07 + 1)).normalize()
  group.quaternion.premultiply(dq.setFromAxisAngle(axis, dt * CONFIG.spin * speed))
  group.updateMatrixWorld()

  camera.position.x += (pointer.x * CONFIG.parallax - camera.position.x) * 0.05
  camera.position.y += (pointer.y * CONFIG.parallax * 0.7 - camera.position.y) * 0.05
  camera.position.z += (camDist - camera.position.z) * 0.06
  camera.lookAt(0, 0, 0)

  ray.set(pointer.x, pointer.y, 0.5).unproject(camera)
  dir.copy(ray).sub(camera.position).normalize()
  n.copy(camera.position).normalize()
  const den = dir.dot(n)
  if (Math.abs(den) > 1e-4) {
    hit.copy(camera.position).addScaledVector(dir, -camera.position.dot(n) / den)
    group.worldToLocal(hit); uniforms.uPointer.value.copy(hit)
  }
  invq.copy(group.quaternion).invert()
  uniforms.uViewLocal.value.copy(n).applyQuaternion(invq)
  uniforms.uPtrStr.value += ((ptrActive ? 1 : 0) - uniforms.uPtrStr.value) * Math.min(1, dt * 4)

  if (uniforms.uBurstAmt.value > 0.001) {
    uniforms.uBurstT.value += dt
    uniforms.uBurstAmt.value *= Math.pow(0.5, dt / 0.7)
    if (uniforms.uBurstT.value > 1.4) uniforms.uBurstAmt.value = 0
  }
  dust.position.copy(camera.position)

  const a = Math.max(0, Math.min(1, (performance.now() - start - 300) / 1400))
  uniforms.iAlpha.value = a * CONFIG.brightness
  edgeMat.opacity = a * CONFIG.edgeAlpha * (0.8 + 0.2 * Math.sin(now * 0.9)) + uniforms.uBurstAmt.value * 0.4
  const an = Math.max(0, Math.min(1, (performance.now() - start - 1200) / 2000))   // Netzwerk blendet nach dem Körper ein
  nodeMat.opacity = an * CONFIG.netBrightness
  nodeEdgeMat.opacity = an * CONFIG.netBrightness * 0.6
  netLineMat.uniforms.uAlpha.value = an * CONFIG.lineAlpha * CONFIG.netBrightness
  mainLineMat.uniforms.uAlpha.value = an * CONFIG.lineAlpha * 0.7 + uniforms.uBurstAmt.value * 0.5
  updateNetwork(dt * speed, now)

  bgRenderer.render(bgScene, camera)
  renderer.render(scene, camera)
}
frame()
</script>
</body>
</html>
